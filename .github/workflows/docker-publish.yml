# Сборка образа на GitHub → GitHub Container Registry (ghcr.io).
# Portainer только делает docker pull, без build на ноде (обходит ошибки BuildKit/gRPC).

name: Docker publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  build-bot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре (требование GHCR)
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('ghcr.io/{0}:latest', env.IMAGE_LC) || '' }}
            ghcr.io/${{ env.IMAGE_LC }}:${{ github.sha }}

  build-site:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре (требование GHCR)
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.site
          push: true
          tags: |
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('ghcr.io/{0}-site:latest', env.IMAGE_LC) || '' }}
            ghcr.io/${{ env.IMAGE_LC }}-site:${{ github.sha }}
