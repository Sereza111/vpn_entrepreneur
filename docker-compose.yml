# Сборка в GitHub Actions → ghcr.io. Если в стеке не задашь IMAGE — подставится образ этого репо.
# Переопределение: IMAGE=ghcr.io/другой/образ:тег
#
# При заданном DB_* бот использует MySQL (см. docs/DATABASE_CUTOVER.md). Иначе — legacy ./data.

services:
  # Опционально: поднимайте только если хотите persistence в БД вместо ./data/*.json.
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vpn_bot}
      MYSQL_USER: ${MYSQL_USER:-vpn_bot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vpn_bot_pw}
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  bot:
    image: ${IMAGE:-ghcr.io/sereza111/vpn_entrepreneur:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Персистентное хранилище привязок подписок (data/xui-links.json),
      # чтобы после redeploy связи Telegram ↔ XUI не терялись.
      - ./data:/app/data
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_APP_URL: ${WEB_APP_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET}
      PRIMARY_SUBSCRIPTION_SOURCE: xui
      # XUI_BASE_URL — хост подписки (обычно порт из «Порт подписки», напр. :2096).
      # XUI_PANEL_BASE_URL — хост панели + при необходимости секретный префикс (напр. https://ip:48408/8dFlsHsLZMTgKsrUhd), иначе POST /login даст 404.
      XUI_BASE_URL: ${XUI_BASE_URL}
      XUI_PANEL_BASE_URL: ${XUI_PANEL_BASE_URL}
      XUI_WEB_BASE_PATH: ${XUI_WEB_BASE_PATH}
      XUI_USERNAME: ${XUI_USERNAME}
      XUI_PASSWORD: ${XUI_PASSWORD}
      XUI_INBOUND_ID: ${XUI_INBOUND_ID}
      XUI_SUB_PATH: ${XUI_SUB_PATH:-/sub}
      XUI_INSECURE_TLS: ${XUI_INSECURE_TLS:-0}
      # XUI_CLIENT_REMARK_TEMPLATE: "{subscriptionTitle} · @{username}"
      XUI_CLIENT_DISPLAY_SUFFIX: ${XUI_CLIENT_DISPLAY_SUFFIX:-🌐}
      XUI_EXTRA_BASE_URLS: ${XUI_EXTRA_BASE_URLS:-}
      XUI_SECONDARY_ENABLED: ${XUI_SECONDARY_ENABLED:-0}
      XUI_SECONDARY_PANEL_BASE_URL: ${XUI_SECONDARY_PANEL_BASE_URL:-}
      XUI_SECONDARY_WEB_BASE_PATH: ${XUI_SECONDARY_WEB_BASE_PATH:-}
      XUI_SECONDARY_USERNAME: ${XUI_SECONDARY_USERNAME:-}
      XUI_SECONDARY_PASSWORD: ${XUI_SECONDARY_PASSWORD:-}
      XUI_SECONDARY_INBOUND_ID: ${XUI_SECONDARY_INBOUND_ID:-0}
      XUI_SECONDARY_INSECURE_TLS: ${XUI_SECONDARY_INSECURE_TLS:-0}
      XUI_SECONDARY_REMARK_PREFIX: ${XUI_SECONDARY_REMARK_PREFIX:-}
      XUI_TERTIARY_ENABLED: ${XUI_TERTIARY_ENABLED:-0}
      XUI_TERTIARY_PANEL_BASE_URL: ${XUI_TERTIARY_PANEL_BASE_URL:-}
      XUI_TERTIARY_WEB_BASE_PATH: ${XUI_TERTIARY_WEB_BASE_PATH:-}
      XUI_TERTIARY_USERNAME: ${XUI_TERTIARY_USERNAME:-}
      XUI_TERTIARY_PASSWORD: ${XUI_TERTIARY_PASSWORD:-}
      XUI_TERTIARY_INBOUND_ID: ${XUI_TERTIARY_INBOUND_ID:-0}
      XUI_TERTIARY_INSECURE_TLS: ${XUI_TERTIARY_INSECURE_TLS:-0}
      XUI_TERTIARY_REMARK_PREFIX: ${XUI_TERTIARY_REMARK_PREFIX:-}
      XUI_TERTIARY_SYNC_ALL_INBOUND_REMARKS: ${XUI_TERTIARY_SYNC_ALL_INBOUND_REMARKS:-1}
      PROXY_SERVERS_JSON: ${PROXY_SERVERS_JSON:-[]}
      ADMIN_GRANT_SECRET: ${ADMIN_GRANT_SECRET:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_CHECKOUT_URL_TEMPLATE: ${PAYMENT_CHECKOUT_URL_TEMPLATE:-}
      PAYMENT_DEFAULT_PRODUCT_CODE: ${PAYMENT_DEFAULT_PRODUCT_CODE:-vpn_30}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      XUI_MERGE_EXTRA_INSECURE_TLS: ${XUI_MERGE_EXTRA_INSECURE_TLS:-0}
      TEST_GRANT_ENABLED: ${TEST_GRANT_ENABLED:-0}
      TELEGRAM_SKIP_WEBHOOK_SETUP: ${TELEGRAM_SKIP_WEBHOOK_SETUP:-0}
      TELEGRAM_WEBHOOK_RETRIES: ${TELEGRAM_WEBHOOK_RETRIES:-12}
      TELEGRAM_WEBHOOK_RETRY_MS: ${TELEGRAM_WEBHOOK_RETRY_MS:-5000}
      TELEGRAM_WEBHOOK_RETRY_INTERVAL_MS: ${TELEGRAM_WEBHOOK_RETRY_INTERVAL_MS:-300000}
      # Раскомментируй или задай через .env, если поднят сервис mysql выше:
      # DB_HOST: mysql
      # DB_PORT: 3306
      # DB_USER: vpn_bot
      # DB_PASSWORD: vpn_bot_pw
      # DB_NAME: vpn_bot
      # Принудительно вернуться к JSON на диске: DB_BACKEND=file

volumes:
  mysql_data: {}
